<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Qué Ves? - Juego de Descripción</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2196F3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ComuniC">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" href="assets/icons/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/pages/descripcion.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Librería de Confeti para la recompensa -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script defer src="scripts/register-service-worker.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" id="back-button"><i class="fas fa-arrow-left"></i> Regresar</a>
            <h1 id="titulo-categoria">¿Qué ves?</h1>
        </nav>
    </header>

    <main id="game-main-descripcion">
        <div id="pictograma-container">
            <img id="pictograma-img" src="assets/images/placeholder.png" alt="Pictograma del juego">
            <button id="parlante-btn-pregunta" class="parlante-btn-descripcion">
                <i class="fas fa-volume-up"></i>
            </button>
        </div>
        
        <div id="opciones-container">
        </div>

        <div id="feedback-container">
            <p id="feedback-descripcion" class="feedback-texto"></p>
            <button id="siguiente-btn" class="btn-principal hidden">Siguiente</button>
        </div>
    </main>

    <audio id="audio-correcto" src="assets/audio/correcto.mp3" preload="auto"></audio>
    <audio id="audio-incorrecto" src="assets/audio/incorrecto.mp3" preload="auto"></audio>

    <script defer src="scripts/pages/descripcion.js"></script>
</body>
</html>
