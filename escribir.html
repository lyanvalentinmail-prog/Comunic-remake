<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escribir y Leer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Cambiado a escribir.js para aislar la lógica -->
    <script defer src="escribir.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="back-button"><i class="fas fa-arrow-left"></i> Regresar</a>
            <h1>Teclado</h1>
        </nav>
    </header>
    <main>
        <div class="page-container">
            <textarea id="texto-escribir" placeholder="Escribe lo que quieras decir..." rows="5"></textarea>
            
            <button id="leer-texto"><i class="fas fa-volume-up"></i> Leer en Voz Alta</button>
            
            <div id="historial-container">
                <div class="historial-header">
                    <h2>Frases Anteriores</h2>
                    <button id="borrar-historial-btn" class="hidden"><i class="fas fa-trash"></i> Vaciar</button>
                </div>
                <ul id="historial-lista"></ul>
            </div>
        </div>
    </main>
</body>
</html>
