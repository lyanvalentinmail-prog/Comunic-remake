<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formar Palabras - Comunicador Visual</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2196F3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ComuniC">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" href="assets/icons/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/pages/palabras.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Librería de Confeti para recompensa visual -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script defer src="scripts/pages/palabras.js"></script>
    <script defer src="scripts/register-service-worker.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" id="back-button"><i class="fas fa-arrow-left"></i> Regresar</a>
            <h1 id="titulo-categoria">Formar Palabras</h1>
        </nav>
    </header>

    <main id="game-main">
        <div id="pictograma-container">
            <img id="pictograma-img" src="" alt="Pictograma de la palabra a formar">
        </div>

        <div id="respuesta-container"></div>

        <div id="feedback-palabras"></div>

        <div id="letras-container"></div>
        
        <button id="siguiente-btn" class="hidden">Siguiente Palabra</button>
    </main>
    
    <audio id="audio-correcto" src="assets/audio/correcto.mp3" preload="auto"></audio>
    <audio id="audio-incorrecto" src="assets/audio/incorrecto.mp3" preload="auto"></audio>
</body>
</html>
